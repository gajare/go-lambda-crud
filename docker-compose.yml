version: '3.8'

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: crud_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: crud_db
      LOG_LEVEL: debug
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data: